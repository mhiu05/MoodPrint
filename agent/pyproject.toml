[project]
name = "moodprint-agent"
version = "0.1.0"
description = "MoodPrint Companion runtime"
requires-python = ">=3.12"
dependencies = ["moodprint-shared", "openai-agents[sqlalchemy]==0.24.*"]

[project.optional-dependencies]
# --- knowledge: Phase 2 owns this extra ---
knowledge = ["httpx>=0.28", "asyncpg>=0.30", "pypdf>=5", "beautifulsoup4>=4.12", "lxml>=5"]
# --- companion: Phase 3 owns this extra ---
companion = ["pillow>=11"]

[tool.uv.sources]
moodprint-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodprint_agent"]
