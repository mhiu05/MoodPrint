licence_note = "Văn bản quy phạm pháp luật. Căn cứ tái sử dụng: Luật Sở hữu trí tuệ Điều 15 khoản 2 loại văn bản quy phạm pháp luật khỏi phạm vi bảo hộ quyền tác giả (nội dung điều luật xác nhận qua nguồn thứ cấp, chưa mở văn bản gốc của luật). Chỉ trích phần văn bản của nghị định; không chép chú thích, bố cục hay bình luận của trang thương mại."
