name: Foundation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_branch:
        description: Optional ownership profile for controlled manual canaries
        type: string
        required: false
permissions:
  contents: read
env:
  TASK_BRANCH: ${{ inputs.simulate_branch || github.head_ref || github.ref_name }}
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-packages --all-extras --locked
      - name: Parallel phase ownership
        run: uv run python scripts/ci_ownership.py --branch "$TASK_BRANCH"
      - name: Migration scope
        run: uv run python scripts/ci_ownership.py --branch "$TASK_BRANCH" --migrations
      - run: uv run python scripts/check.py
      - run: uv run python scripts/export_contract_schemas.py --check
      - run: uv run python scripts/export_openapi.py --check
      - run: npm ci
        working-directory: frontend
      - name: Generated API schema drift
        run: npm run gen:api && git diff --exit-code -- src/services/http/schema.gen.ts
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm run format:check && npm test -- --maxWorkers=2 && npm run build && npm run check:boundaries
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --all-packages --all-extras --locked
      - name: Parallel phase ownership
        run: uv run python scripts/ci_ownership.py --branch "$TASK_BRANCH" --migrations
      - run: uv run python scripts/dev/supabase_worktree.py start
      - run: uv run python scripts/dev/bootstrap_local_db.py
      - run: uv run python scripts/dev/supabase_worktree.py test
      - run: uv run pytest -m integration -q
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uv run python scripts/e2e_stack.py --run --project demo
      - run: uv run python scripts/e2e_stack.py --run --project real --agent scripted
      - if: always()
        run: npx --yes supabase@2.122.1 stop --no-backup
