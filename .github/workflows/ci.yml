name: Foundation
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-packages --locked
      - run: uv run python scripts/check.py
      - run: uv run python scripts/export_contract_schemas.py --check
      - run: uv run python scripts/export_openapi.py --check
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build && npm run check:boundaries
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --all-packages --locked
      - run: uv run python scripts/dev/supabase_worktree.py start
      - run: uv run python scripts/dev/bootstrap_local_db.py
      - run: npx --yes supabase@2.122.1 test db
      - run: uv run pytest -m integration -q
      - if: always()
        run: npx --yes supabase@2.122.1 stop --no-backup
