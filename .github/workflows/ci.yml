name: Foundation
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --all-packages --locked
      - run: uv run python scripts/check.py
      - run: uv run python scripts/export_contract_schemas.py --check
      - run: uv run python scripts/export_openapi.py --check
      - name: Parallel phase ownership
        env:
          TASK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$TASK_BRANCH" in
            feat/knowledge-ingestion-rag) uv run python scripts/check_ownership.py --phase 2 --base baseline/phase-1-verified ;;
            feat/agent-companion) uv run python scripts/check_ownership.py --phase 3 --base baseline/phase-1-verified ;;
          esac
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test -- --maxWorkers=2 && npm run build && npm run check:boundaries
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --all-packages --locked
      - run: uv run python scripts/dev/supabase_worktree.py start
      - run: uv run python scripts/dev/bootstrap_local_db.py
      - run: npx --yes supabase@2.122.1 test db
      - run: uv run pytest -m integration -q
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uv run python scripts/e2e_stack.py --run
      - if: always()
        run: npx --yes supabase@2.122.1 stop --no-backup
