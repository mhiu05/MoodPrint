name: Verify local application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # pgvector matches the hosted extension version required by migration 0009.
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_DB: moodprint_test
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Python tooling
        run: pipx install uv==0.11.14
      - name: Backend checks against disposable PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/moodprint_test
        run: |
          uv sync --locked --python 3.12.13
          uv run ruff check app tests evals alembic ../scripts/load_chat_memory.py ../scripts/apply_supabase_review.py ../scripts/provision_supabase_runtime.py ../scripts/check_reviewed_artifacts.py ../scripts/test_supabase_fullstack.py ../scripts/load_social_mood.py ../scripts/test_fullstack.py ../scripts/load_guest_experience.py ../scripts/prepare_guest_migration_review.py ../scripts/verify_guest_migration_review.py
          uv run mypy app
          uv run pytest -q
          uv run python ../scripts/export_openapi.py
      - name: Migration chain and single-worker (production topology) synthetic load
        working-directory: backend
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          psql -h 127.0.0.1 -U postgres -c "create database moodprint_migration_test"
          psql -h 127.0.0.1 -U postgres -c "create database moodprint_load_test"
          DATABASE_URL='' DATABASE_MIGRATION_URL=postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/moodprint_migration_test uv run alembic upgrade head
          DATABASE_URL='' DATABASE_MIGRATION_URL=postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/moodprint_migration_test uv run alembic check
          TEST_DATABASE_URL=postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/moodprint_load_test MOODPRINT_LOAD_AI_TIMEOUT=10 MOODPRINT_LOAD_HOLD_SECONDS=8 uv run python ../scripts/load_chat_memory.py --workers 1 --users 10 --crash-kill --output "$RUNNER_TEMP/load-results.json"
          psql -h 127.0.0.1 -U postgres -c "create database moodprint_social_load_test"
          TEST_DATABASE_URL=postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/moodprint_social_load_test uv run python ../scripts/load_social_mood.py --users 10 --output "$RUNNER_TEMP/load-social.json"
      - name: Frontend and contract drift
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=low
          npm run contracts:generate
          git diff --exit-code -- src/api/generated/schema.d.ts ../backend/openapi.json
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Full stack with synthetic accounts and SDK fake model
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only@127.0.0.1:5432/moodprint_test
        run: uv run python ../scripts/test_fullstack.py
      - name: Reviewed SQL approvals integrity
        run: python scripts/check_reviewed_artifacts.py
      - name: Technical documentation links and inventories
        run: python scripts/check_docs.py
      - name: AWS release poller validation
        run: python3 -m unittest discover -s deploy/aws/tests -v
      - name: Workflow syntax
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Production Docker and Compose packaging
        env:
          API_IMAGE: moodprint-api:ci
          WEB_IMAGE: moodprint-web:ci
          API_ENV_FILE: ../backend/.env.example
          APP_DOMAIN: staging.example.org
        run: |
          docker build --platform linux/amd64 -t "$API_IMAGE" backend
          docker build --platform linux/amd64 -t "$WEB_IMAGE" frontend
          docker compose -f deploy/compose.staging.yml config -q
          docker run --rm -e APP_DOMAIN="$APP_DOMAIN" \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$WEB_IMAGE" caddy validate --config /etc/caddy/Caddyfile
          docker run --rm --entrypoint sh "$API_IMAGE" -c 'test ! -e /srv/moodprint/.env'
          docker run --rm --entrypoint sh "$WEB_IMAGE" -c '! find /srv -name "*.map" -print -quit | grep -q .'
          bash scripts/test_staging_proxy.sh
      - name: Production image builds (SPA + API, no secrets)
        run: |
          docker build -t moodprint:ci .
          docker run --rm --entrypoint sh moodprint:ci -c 'test ! -e /srv/moodprint/.env && test -f /srv/moodprint/static/index.html && test "$(id -u)" = 10001'
