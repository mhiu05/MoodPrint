[project]
name = "safevoice-shared"
version = "0.1.0"
description = "Shared configuration and service contracts for SafeVoice"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "pydantic-settings>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safevoice_shared"]
