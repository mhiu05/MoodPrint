[project]
name = "moodprint-backend"
version = "0.1.0"
description = "MoodPrint modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.161.1", "pydantic==2.14.1", "pydantic-settings==2.16.1",
  "sqlalchemy==2.0.55", "psycopg[binary]==3.3.6", "alembic==1.20.1",
  "httpx==0.28.1", "uvicorn==0.54.0", "openai-agents==0.24.0", "tzdata==2026.5",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2", "mypy==1.20.2"]
eval = [
    "deepeval==4.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires a real disposable PostgreSQL database", "live: opt-in external provider test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/"]
