[project]
name = "safevoice-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "safevoice-shared", "safevoice-agent[knowledge,companion]", "fastapi>=0.115", "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30", "pyjwt[crypto]>=2.10", "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
