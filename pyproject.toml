[project]
name = "moodprint-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "agent", "backend"]

[tool.uv.sources]
moodprint-shared = { workspace = true }
moodprint-agent = { workspace = true }

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "ruff>=0.14", "pyright>=1.1", "import-linter>=2", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "agent/tests", "backend/tests", "scripts/db/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration and not live_agent' --import-mode=importlib"
markers = ["integration: requires isolated local Supabase", "live_agent: opt-in paid model smoke"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend", ".agents", ".claude", ".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pyright]
include = ["shared/src", "agent/src", "backend/app"]
typeCheckingMode = "standard"
strict = ["shared/src", "agent/src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
