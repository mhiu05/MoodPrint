name: moodprint-staging
services:
  api:
    image: ${API_IMAGE:?Set an immutable API image digest}
    env_file:
      - ${API_ENV_FILE:?Set the path to the root-owned runtime env file}
    environment:
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    stop_grace_period: 150s
    healthcheck:
      test: [CMD, /srv/moodprint/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/health/ready',timeout=5)"]
      interval: 20s
      timeout: 7s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [internal]

  # Scheduled check-ins (96 HD-01): same image as api, separate process and limits. It idles
  # (heartbeat only) until PROACTIVE_WORKER_ENABLED=true in its env file; the API never runs it.
  proactive:
    image: ${API_IMAGE:?Set an immutable API image digest}
    command: [/srv/moodprint/.venv/bin/python, -m, app.jobs.proactive]
    env_file:
      - ${API_ENV_FILE:?Set the path to the root-owned runtime env file}
    environment:
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      # HD-02: 2 + 0 keeps API (5+2)x2 + worker 2 = 16 of moodprint_backend's 20 connections.
      DATABASE_POOL_SIZE: ${PROACTIVE_DATABASE_POOL_SIZE:-2}
      DATABASE_POOL_OVERFLOW: '0'
      PROACTIVE_WORKER_ENABLED: ${PROACTIVE_WORKER_ENABLED:-false}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    # An interrupted job keeps its lease and is reclaimed after 90 s; nothing half-commits.
    stop_grace_period: 100s
    healthcheck:
      test: [CMD, /srv/moodprint/.venv/bin/python, -m, app.jobs.proactive, --health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [internal]

  web:
    image: ${WEB_IMAGE:?Set an immutable web image digest}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set a staging domain}
      # Empty keeps the CSP strictly same-origin; set to the CAPTCHA origin only with the guest entry.
      GUEST_CAPTCHA_ORIGIN: ${GUEST_CAPTCHA_ORIGIN:-}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    depends_on: [api]
    networks: [internal]

networks:
  internal: {}
volumes:
  caddy_data: {}
  caddy_config: {}
