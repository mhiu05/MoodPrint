name: moodprint
services:
  database:
    # Migrations include pgvector; plain postgres lacks the vector extension.
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: moodprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: moodprint-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moodprint"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-local:
