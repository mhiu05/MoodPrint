# CLI commands are pinned by scripts/dev/supabase_worktree.py to 2.122.1.
# Keep application schemas out of the public Data API.
project_id = "moodprint-foundation"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "2GiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://127.0.0.1:5178/**", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
signing_keys_path = "../.local/signing_keys.json"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 54327
